{% extends "base.html" %}
{% block title %}Crear cuenta · AeternaLib{% endblock %}
{% block content %}
<div class="container ae-auth my-5" style="max-width: 640px;">
  <div class="ae-form-card">
    <div class="text-center mb-4">
      <div class="icon fs-1"><i class="bi bi-person-plus"></i></div>
      <h3 class="mb-1">Crear cuenta</h3>
      <p class="text-muted mb-0">Regístrate gratis para rentar libros.</p>
    </div>

    <form method="post" action="{{ url_for('auth.register') }}">
      <div class="mb-3">
        <label class="form-label" for="name">Nombre completo *</label>
        <input class="form-control" id="name" name="name" required maxlength="120" autofocus
               autocomplete="name" value="{{ form.get('name', '') }}">
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="document">Identificación (documento) *</label>
          <input class="form-control" id="document" name="document" required maxlength="30"
                 value="{{ form.get('document', '') }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="phone">Teléfono de contacto</label>
          <input type="tel" class="form-control" id="phone" name="phone" maxlength="30"
                 placeholder="300 123 4567" autocomplete="tel" value="{{ form.get('phone', '') }}">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Correo electrónico *</label>
        <input type="email" class="form-control" id="email" name="email" required maxlength="120"
               autocomplete="email" value="{{ form.get('email', '') }}">
      </div>

      <div class="row">
        <div class="col-md-6 mb-4">
          <label class="form-label" for="password">Contraseña *</label>
          <input type="password" class="form-control" id="password" name="password" required
                 minlength="8" autocomplete="new-password">
          <div class="form-text">Mínimo 8 caracteres.</div>
        </div>
        <div class="col-md-6 mb-4">
          <label class="form-label" for="confirm">Repite la contraseña *</label>
          <input type="password" class="form-control" id="confirm" name="confirm" required
                 minlength="8" autocomplete="new-password">
        </div>
      </div>

      <button class="btn btn-ae btn-lg w-100"><i class="bi bi-check-lg"></i> Crear cuenta</button>
    </form>

    <p class="text-center mt-4 mb-0">
      ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
    </p>
  </div>
</div>
{% endblock %}
