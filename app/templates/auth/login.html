{% extends "base.html" %}
{% block title %}Iniciar sesión · AeternaLib{% endblock %}
{% block content %}
<div class="container ae-auth my-5">
  <div class="ae-form-card">
    <div class="text-center mb-4">
      <div class="icon fs-1"><i class="bi bi-box-arrow-in-right"></i></div>
      <h3 class="mb-1">Iniciar sesión</h3>
      <p class="text-muted mb-0">Accede para rentar libros y ver tus préstamos.</p>
    </div>

    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="next" value="{{ next_url }}">

      <div class="mb-3">
        <label class="form-label" for="email">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" name="email" required autofocus
                 autocomplete="email" value="{{ email }}">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" required
                 autocomplete="current-password">
        </div>
      </div>

      <button class="btn btn-ae btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
    </form>

    <p class="text-center mt-4 mb-0">
      ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a>
    </p>
  </div>
</div>
{% endblock %}
