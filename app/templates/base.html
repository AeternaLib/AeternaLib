<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AeternaLib{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/aeterna.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg ae-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
        <i class="bi bi-book-half me-1"></i> AeternaLib
      </a>
      <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('books.index') }}">Libros</a></li>
          
          {# Se activan cuando existan los blueprints:
          <li class="nav-item"><a class="nav-link" href="{{ url_for('authors.index') }}">Autores</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('users.index') }}">Usuarios</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('loans.index') }}">Préstamos</a></li>
          #}
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="ae-footer text-center py-3 mt-5">
    <small>© AeternaLib · Biblioteca Digital</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
